<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kelsey &amp; Oli’s Shelf of Shame</title>
<style>html,body{margin:0}</style>
</head>
<body>
<!-- Kelsey & Oli’s Shelf of Shame — paste into a HubSpot Custom HTML module. Two settings to fill in are marked SETTINGS below. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bodoni+Moda:opsz,wght@6..96,600;6..96,700&family=DM+Serif+Display&family=Nunito+Sans:wght@400;500;600;700;800&family=Special+Elite&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Courier+Prime:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<div class="sos" id="sos">
<style>
.sos{--pink:#F3A5C5;--baby:#F8E8EE;--red:#E52D35;--cream:#FFF9F4;--ink:#30272B;
 font-family:'Nunito Sans',system-ui,sans-serif;font-weight:500;color:var(--ink);background:var(--cream);padding:54px 20px 76px;box-sizing:border-box;position:relative;overflow:hidden}
.sos *{box-sizing:border-box}
.sos-wrap{max-width:1000px;margin:0 auto;position:relative}
.sos-star{position:absolute;color:var(--red);font-size:36px;line-height:1;pointer-events:none}
.sos-kicker{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.19em;color:var(--red);margin:0 0 14px}
.sos h1{display:flex;flex-wrap:wrap;gap:5px 4px;align-items:center;margin:0 0 18px;line-height:1.05;font-size:clamp(30px,6vw,62px);font-weight:400;max-width:900px}
.sos-ransom{display:inline-flex;align-items:center;justify-content:center;min-width:.66em;padding:.035em .11em .09em;background:var(--paper,#F8E8EE);color:var(--letter,#57494E);border:1px solid rgba(80,60,68,.12);box-shadow:0 2px 0 rgba(48,39,43,.08);transform:rotate(var(--tilt,0deg)) scale(var(--scale,1));font-family:var(--font,'Bodoni Moda'),serif;font-size:var(--size,1em);font-weight:var(--weight,700);line-height:1.08}
.sos-ransom:nth-child(5n){border-radius:2px 5px 2px 4px}
.sos-ransom.space{background:transparent;border:0;box-shadow:none;min-width:.22em;padding:0;transform:none}
.sos-rule{height:2px;background:var(--red);width:100%;margin:0 0 20px;position:relative}
.sos-rule:after{content:'✳';position:absolute;right:8px;top:-17px;background:var(--cream);padding:0 5px;color:var(--red);font-size:23px}
.sos-sub{margin:0 0 30px;font-size:16px;max-width:66ch;line-height:1.65;color:#57494E}
.sos-tonight{background:#fffdfa;border:1px solid #eadde0;border-radius:5px;padding:22px 24px;margin-bottom:34px;box-shadow:0 7px 20px rgba(68,40,49,.06);position:relative}
.sos-tonight:after{content:'✳';position:absolute;right:20px;top:13px;color:var(--red);font-size:25px}
.sos-tonight h2{font-family:'Bodoni Moda',Georgia,serif;font-weight:700;font-size:clamp(23px,3.5vw,31px);line-height:1.1;margin:0 0 6px;color:var(--red)}
.sos-tonight p{margin:0 0 14px;color:#66565C}
.sos-times{display:flex;flex-wrap:wrap;gap:9px}
.sos-btn,.sos-times button{font:700 14px 'Nunito Sans',sans-serif;padding:10px 16px;border-radius:3px;border:1px solid var(--red);background:transparent;color:var(--red);cursor:pointer;text-decoration:none;display:inline-block;transition:background .15s,color .15s,transform .15s}
.sos-btn:hover,.sos-times button:hover{background:var(--red);color:#fff;transform:translateY(-1px)}
.sos-btn.hot{background:var(--red);color:#fff}
.sos button:focus-visible,.sos .sos-box:focus-visible,.sos a:focus-visible{outline:2px solid var(--red);outline-offset:4px}
.sos-pick{display:none;margin-top:18px;background:var(--baby);border:1px solid #e8d4dc;border-radius:5px;padding:16px 18px;gap:16px}
.sos-pick.on{display:flex;animation:sos-pop .25s ease}
.sos-pick img{width:120px;height:145px;object-fit:contain;border:1px solid #e7d9dd;flex:none;background:#fff}
.sos-pick h3{font-family:'Bodoni Moda',Georgia,serif;font-weight:700;font-size:25px;line-height:1.1;margin:0 0 2px;color:var(--red)}
.sos-pick p{margin:6px 0}
.sos-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.sos-meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.sos-meta span{background:#fffdfa;border:1px solid #e6d7dc;border-radius:2px;padding:3px 9px;font-size:11px;font-weight:700;color:#66565C}
.sos-count{margin:0 0 4px;font-family:'Bodoni Moda',Georgia,serif;font-size:20px}
.sos-sync{margin:0 0 14px;font-size:12px;color:#8a7a80;min-height:1.2em}
.sos-shelf{display:grid;grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));gap:28px 22px;padding:14px 4px 20px;align-items:start}
.sos-box{position:relative;display:block;width:100%;aspect-ratio:3/4;border:1px solid rgba(70,52,60,.14);border-radius:3px;padding:0;overflow:visible;cursor:pointer;color:var(--ink);font-family:inherit;text-align:left;transform:rotate(var(--rot,0deg));transform-origin:50% 80%;box-shadow:0 8px 22px rgba(48,39,43,.13);transition:transform .24s cubic-bezier(.2,.8,.2,1),box-shadow .24s,opacity .3s,filter .3s;background:var(--paper,#F8E8EE)}
.sos-box:before{content:'';position:absolute;inset:7px -7px -7px 7px;border:1px solid rgba(229,45,53,.18);z-index:-1;background:rgba(255,255,255,.5)}
.sos-box .sos-fb{position:absolute;inset:0;padding:14px 11px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(48,39,43,.13));color:#fff;text-shadow:0 1px 5px rgba(0,0,0,.48);z-index:1}
.sos-box .sos-fb b{font-family:'Bodoni Moda',Georgia,serif;font-weight:700;font-size:clamp(13px,1.5vw,18px);line-height:1.02;word-break:break-word}
.sos-box .sos-fb small{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.sos-box img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;z-index:2}
.sos-box.has-art .sos-fb{display:none}
.sos-box.no-art .sos-fb{background:linear-gradient(145deg,var(--paper,#F8E8EE),#fff);color:var(--ink);text-shadow:none;justify-content:center;align-items:center;text-align:center}
.sos-box.no-art .sos-fb b{font-size:clamp(15px,1.8vw,21px)}
.sos-box.no-art .sos-fb small{color:var(--red);margin-top:12px}
.sos-box.lift,.sos-box:hover{transform:translateY(-13px) scale(1.055) rotate(0);box-shadow:0 18px 32px rgba(48,39,43,.2);z-index:20!important}
.sos-box.played{filter:grayscale(1);opacity:.45}
.sos-box.played:after{content:'PLAYED ✓';position:absolute;left:50%;top:50%;z-index:5;transform:translate(-50%,-50%) rotate(-12deg);background:#fff;color:var(--ink);border:2px solid var(--ink);padding:3px 10px;font:700 12px 'Bebas Neue',sans-serif;letter-spacing:.14em;white-space:nowrap}
.sos-box.played.lift,.sos-box.played:hover{opacity:.9}
.sos-box.glow{animation:sos-glow .8s ease 3}
@keyframes sos-glow{50%{box-shadow:0 0 0 3px var(--red),0 0 18px 4px rgba(229,45,53,.22)}}
@keyframes sos-pop{from{transform:translateY(5px);opacity:0}}
.sos-popup{position:fixed;z-index:50;width:320px;max-width:calc(100vw - 24px);background:#fffdfa;color:var(--ink);border:1px solid #e6d8dc;border-radius:5px;padding:16px;box-shadow:0 12px 34px rgba(48,39,43,.18);display:none}
.sos-popup.on{display:block;animation:sos-pop .18s ease}
.sos-popup>img{width:100%;max-height:210px;object-fit:contain;border:1px solid #eee3e5;margin-bottom:10px;background:#fff}
.sos-popup h3{font-family:'Bodoni Moda',Georgia,serif;font-weight:700;font-size:25px;line-height:1.05;margin:0 0 4px;color:var(--red)}
.sos-popup p{margin:8px 0;line-height:1.55;font-size:14px;color:#57494E}
.sos-popup .sos-btn{font-size:12px;padding:8px 12px;margin:2px 6px 2px 0}
.sos-tick{display:flex;gap:10px;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid #eadde0;cursor:pointer;font-size:13px}
.sos-tick input{width:19px;height:19px;accent-color:var(--red)}
.sos-empty{text-align:center;font-family:'Bodoni Moda',Georgia,serif;font-size:clamp(23px,4vw,32px);padding:20px;color:var(--red);background:#fffdfa;border:1px solid #e6d8dc;margin-bottom:20px}
@media(max-width:900px){.sos-shelf{--cols:3!important;gap:24px 18px}}
@media(max-width:560px){.sos{padding:38px 14px 58px}.sos-pick.on{flex-direction:column}.sos-pick img{width:100%;height:160px}.sos-shelf{--cols:2!important;gap:20px 15px}.sos-popup{max-height:calc(100vh - 24px);overflow-y:auto}}
@media(prefers-reduced-motion:reduce){.sos *{animation:none!important;transition:none!important}}
</style>
<div class="sos-wrap">
  <span class="sos-star" style="top:-8px;right:4%">✳</span><span class="sos-star" style="top:66px;right:14%;font-size:22px">✳</span>
  <p class="sos-kicker">KELSEYOU GAMING PRESENTS · KELSEY &amp; OLI</p>
  <h1 id="sos-title" aria-label="Our Shelf of Shame"></h1>
  <div class="sos-rule"></div>
  <p class="sos-sub">The games we bought with the very best intentions… and somehow still haven’t played. Choose our next game, then give it the attention it deserves.</p>
  <section class="sos-tonight" aria-live="polite">
    <h2>What are we playing tonight?</h2>
    <p>How long have we got?</p>
    <div class="sos-times" id="sos-times"></div>
    <div class="sos-pick" id="sos-pick"></div>
  </section>
  <p class="sos-count" id="sos-count"></p>
  <p class="sos-sync" id="sos-sync"></p>
  <div class="sos-shelf" id="sos-shelf" aria-label="Board game collection"></div>
</div>
<div class="sos-popup" id="sos-popup" role="dialog" aria-label="Game details"></div>
<script>
(function(){
/* ================= SETTINGS (fill these in) =================
   1) ASSET_BASE: the folder URL where you uploaded the box art + rules PDFs in HubSpot Files (keep the trailing slash).
   2) SYNC_URL:  your Firebase Realtime Database URL + a secret name, e.g. "https://xxxx-default-rtdb.europe-west1.firebasedatabase.app/kelsey-oli-7f3k9"
      (leave "" to save on each device only). */
var ASSET_BASE="assets/";
var SYNC_URL="";

/* Each game: slug = file name. Box art file = slug.jpg, rules file = slug-rules.pdf (set rules:false if there isn't one). */
var GAMES=[
 {slug:"foxglove-farm",title:"Foxglove Farm",type:"Tile placement",players:[1,4],time:45,desc:"Build your fox town with buildings and trails, produce goods and move them around to score over four quick rounds. Sequel to Timber Town.",rules:true,link:"https://boardgamegeek.com/boardgame/466715/foxglove-farm"},
 {slug:"river-valley-glassworks",title:"River Valley Glassworks",type:"Drafting puzzle",players:[1,5],time:30,desc:"Place glass in the river, gather what flows past and fill your glassworks with colourful pieces for rows and columns of points.",rules:true,link:"https://boardgamegeek.com/boardgame/407297/river-valley-glassworks"},
 {slug:"cozy-cat-cafe",title:"Cozy Cat Cafe",type:"Tile placement",players:[1,5],time:60,desc:"Adopt cats, buy furniture and invite customers into your cafe, fitting tiles onto your board over three rounds.",rules:true,link:"https://boardgamegeek.com/boardgame/439361/cozy-cat-cafe"},
 {slug:"wingspan",title:"Wingspan",type:"Engine builder",players:[1,5],time:60,desc:"Attract birds to your wildlife preserves and chain their powers together over four rounds.",rules:true,link:"https://boardgamegeek.com/boardgame/266192/wingspan"},
 {slug:"horrified",title:"Horrified",type:"Co-op",players:[1,5],time:60,desc:"Work together to hunt down classic movie monsters before they overrun the village.",rules:true,link:"https://boardgamegeek.com/boardgame/282524/horrified"},
 {slug:"inkwell",title:"Inkwell",type:"Drafting",players:[1,5],time:35,desc:"Draft ink to fill your manuscript pages in a medieval abbey, while the abbot ticks the game towards its end.",rules:true,link:"https://boardgamegeek.com/boardgame/442307/inkwell"},
 {slug:"the-hobbit-there-and-back-again",title:"The Hobbit: There and Back Again",type:"Dice adventure",players:[1,4],time:30,desc:"A roll-and-draw dice game across eight adventures from Bilbo’s journey. Each part takes about 30 minutes.",rules:true,link:"https://boardgamegeek.com/boardgame/436215/the-hobbit-there-and-back-again"},
 {slug:"fellowship-of-the-ring-trick-taking",title:"The Lord of the Rings: The Fellowship of the Ring",type:"Co-op trick-taking",players:[1,4],time:20,desc:"Play through 18 story chapters as a team of trick-takers, each chapter with different heroes and goals. About 20 minutes a chapter.",rules:true,link:"https://boardgamegeek.com/boardgame/429293/the-lord-of-the-rings-the-fellowship-of-the-ring-t"},
 {slug:"lairs",title:"Lairs",type:"Two-player mapping duel",players:[2,2],time:40,desc:"Build a trap-filled lair for your rival, then explore and map theirs blind. Best explorer wins.",rules:true,link:"https://boardgamegeek.com/boardgame/404883/lairs"},
 {slug:"honeypot",title:"Honeypot",type:"Set collection",players:[1,6],time:25,desc:"Secret-agent bears. Stack a stash of cards for others to pick from, and sift the ones handed to you without getting stung.",rules:false,link:"https://boardgamegeek.com/boardgame/458391/honeypot"},
 {slug:"spooky-bar",title:"Spooky Bar",type:"Card game",players:[2,4],time:20,desc:"Run a haunted bar. Everyone plays two action cards at once to serve drinks, bottle ghosts and wave guests off. Most coins wins.",rules:true,link:"https://boardgamegeek.com/boardgame/468949/spooky-bar"},
 {slug:"panorama",title:"Panorama",type:"Tile collecting",players:[2,4],time:20,desc:"Float your hot-air balloon along, collecting tiles to build a landscape, then multiply flowers by animals in each terrain.",rules:true,link:"https://boardgamegeek.com/boardgame/462763/panorama"},
 {slug:"yotei",title:"Yotei",type:"Worker placement & bidding",players:[2,4],time:45,desc:"Build a town at the foot of Mt Yotei. Place tokens and pay potatoes to claim cards, then harvest them for charm points.",rules:true,link:"https://boardgamegeek.com/boardgame/456860/yotei"},
 {slug:"alice-through-the-looking-glass",title:"Alice Through the Looking Glass",type:"Flip & write",players:[2,6],time:30,desc:"Everyone draws the same shapes onto their own maze sheet at once. Collect bonuses, pass through the looking-glass and score.",rules:true,link:"https://boardgamegeek.com/boardgame/448432/alice-through-the-looking-glass"},
 {slug:"jisogi-anime-studio-tycoon",title:"Jisogi: Anime Studio Tycoon",type:"Worker placement",players:[1,4],time:90,desc:"Run an anime studio on a shoestring: hire staff, follow trends and release hits before the debts catch up.",rules:true,link:"https://boardgamegeek.com/boardgame/429845/jisogi-anime-studio-tycoon"}
];

var KEY="kelsey-oli-shelf-played",COLORS=["#F3A5C5","#E8DFF2","#F7DF91","#B9D9B7","#C9B5E5","#F6DCE6","#E3EDF2","#FFF5EB"];
var READY=ASSET_BASE.indexOf("YOUR-")<0,SYNC=SYNC_URL.replace(/\/+$/,"");
var $=function(id){return document.getElementById(id)};
var shelf=$("sos-shelf"),popup=$("sos-popup"),pick=$("sos-pick"),played={},hideT=null;
function img(g){return READY?ASSET_BASE+g.slug+".jpg":""}
function pdf(g){return READY&&g.rules?ASSET_BASE+g.slug+"-rules.pdf":""}
function pl(g){return g.players[0]===g.players[1]?g.players[0]:g.players[0]+"–"+g.players[1]}
function meta(g){return '<div class="sos-meta"><span>'+g.type+'</span><span>'+pl(g)+' players</span><span>'+g.time+' min</span></div>'}
function links(g){var r=pdf(g);return (r?'<a class="sos-btn hot" href="'+r+'" target="_blank" rel="noopener">Read the rules (PDF)</a>':'')+(g.link?'<a class="sos-btn" href="'+g.link+'" target="_blank" rel="noopener">Game page</a>':'')}
function art(g){var s=img(g);return s?'<img src="'+s+'" alt="'+g.title+' box art" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">':''}
function say(t){$("sos-sync").textContent=t}

/* ---- storage: this device + (optional) shared cloud copy ---- */
function loadLocal(){try{played=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){played={}}}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(played))}catch(e){}}
function pull(){
  if(!SYNC)return Promise.resolve();
  return fetch(SYNC+"/played.json",{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
    played=d||{};saveLocal();render();say("Synced between your phones ✓")
  }).catch(function(){say("Couldn’t reach the shared list. Showing what’s saved on this device.")});
}
function push(slug,val){
  saveLocal();if(!SYNC){say("Saved on this device only.");return}
  fetch(SYNC+"/played/"+slug+".json",{method:val?"PUT":"DELETE",body:val?"true":undefined}).then(function(r){if(!r.ok)throw 0;say("Synced between your phones ✓")}).catch(function(){say("Couldn’t save to the shared list. Will retry on refresh.")});
}
function setPlayed(slug,val){if(val)played[slug]=true;else delete played[slug];render();push(slug,val)}

function buildTitle(){
  var t=$("sos-title"),words=["OUR","SHELF","OF","SHAME"];
  var papers=["#F6DCE6","#E8DFF2","#E5EEE2","#F8EBCB","#E3EDF2","#F3E3E0"],inks=["#B96F8C","#8D78A9","#718A78","#B38B45","#6F8795","#B66E68"];
  var fonts=["'Bodoni Moda',serif","'Special Elite',serif","'Bebas Neue',sans-serif","'DM Serif Display',serif","'Courier Prime',monospace","'Patrick Hand',cursive","'Playfair Display',serif"];
  var r=function(a){return a[Math.floor(Math.random()*a.length)]};
  words.forEach(function(w,wi){
    if(wi){var g=document.createElement("span");g.className="sos-ransom space";g.textContent=" ";t.appendChild(g)}
    w.split("").forEach(function(ch){var l=document.createElement("span");l.className="sos-ransom";l.textContent=ch;
      l.style.setProperty("--tilt",(Math.random()*9-4.5).toFixed(1)+"deg");l.style.setProperty("--scale",(.91+Math.random()*.16).toFixed(2));
      l.style.setProperty("--paper",r(papers));l.style.setProperty("--letter",r(inks));l.style.setProperty("--font",r(fonts));
      l.style.setProperty("--size",(.88+Math.random()*.22).toFixed(2)+"em");l.style.setProperty("--weight",Math.random()>.35?"700":"400");t.appendChild(l)});
  });
}

function render(){
  var c=window.innerWidth<560?2:(window.innerWidth<900?3:5);shelf.style.setProperty("--cols",c);shelf.innerHTML="";
  var left=0;
  GAMES.forEach(function(g,i){
    var done=!!played[g.slug];if(!done)left++;
    var b=document.createElement("button");b.type="button";b.dataset.i=i;
    b.className="sos-box"+(done?" played":"")+(READY?" has-art":" no-art");
    b.style.setProperty("--rot",(((i%5)-2)*1.25)+"deg");b.style.setProperty("--paper",COLORS[i%COLORS.length]);
    b.setAttribute("aria-label",g.title+(done?" (played)":"")+", view details");
    b.innerHTML='<span class="sos-fb"><b>'+g.title+'</b><small>'+pl(g)+' players · '+g.time+' min</small></span>'+art(g);
    var im=b.querySelector("img");if(im)im.addEventListener("error",function(){b.classList.remove("has-art");b.classList.add("no-art")});
    b.addEventListener("mouseenter",function(e){show(i,e.currentTarget)});
    b.addEventListener("focus",function(e){show(i,e.currentTarget)});
    b.addEventListener("click",function(e){e.stopPropagation();show(i,e.currentTarget)});
    b.addEventListener("mouseleave",function(){hideT=setTimeout(hide,240)});
    shelf.appendChild(b);
  });
  var cl=$("sos-clear");if(cl)cl.remove();
  $("sos-count").textContent=left?left+" still waiting for their first play · "+(GAMES.length-left)+" played":"";
  if(!left)shelf.insertAdjacentHTML("beforebegin",'<div class="sos-empty" id="sos-clear">SHELF CLEARED! Time to add more games… ✳</div>');
}

function show(i,el){
  clearTimeout(hideT);var g=GAMES[i];
  document.querySelectorAll(".sos-box.lift").forEach(function(x){x.classList.remove("lift")});el.classList.add("lift");
  popup.innerHTML=art(g)+"<h3>"+g.title+"</h3>"+meta(g)+"<p>"+g.desc+"</p>"+links(g)+
   '<label class="sos-tick"><input type="checkbox"'+(played[g.slug]?" checked":"")+'> We’ve played it</label>';
  popup.classList.add("on");
  var r=el.getBoundingClientRect(),w=popup.offsetWidth,h=popup.offsetHeight,vw=innerWidth,vh=innerHeight;
  var x=r.right+16;if(x+w>vw-12)x=r.left-w-16;var y=Math.max(12,Math.min(vh-h-12,r.top-10));
  if(vw<700||x<12){x=Math.max(12,(vw-w)/2);y=r.bottom+16;if(y+h>vh-12)y=Math.max(12,r.top-h-16)}
  popup.style.left=x+"px";popup.style.top=y+"px";
  popup.querySelector("input").addEventListener("change",function(e){var on=e.target.checked;hide();setPlayed(g.slug,on)});
}
function hide(){popup.classList.remove("on");document.querySelectorAll(".sos-box.lift").forEach(function(x){x.classList.remove("lift")})}
popup.addEventListener("mouseenter",function(){clearTimeout(hideT)});
popup.addEventListener("mouseleave",function(){hideT=setTimeout(hide,240)});
document.addEventListener("click",function(e){if(!popup.contains(e.target))hide()});
document.addEventListener("keydown",function(e){if(e.key==="Escape")hide()});
addEventListener("scroll",hide,{passive:true});
var lastC=-1;addEventListener("resize",function(){var c=innerWidth<560?2:(innerWidth<900?3:5);if(c!==lastC){lastC=c;hide();render()}});

[["Up to 30 min",30],["Up to an hour",60],["Up to 90 min",90],["We’ve got all night",9999]].forEach(function(o){
  var b=document.createElement("button");b.type="button";b.textContent=o[0];b.onclick=function(){choose(o[1])};$("sos-times").appendChild(b)});
function choose(max){
  var pool=[];GAMES.forEach(function(g,i){if(!played[g.slug]&&g.time<=max&&g.players[0]<=2&&g.players[1]>=2)pool.push(i)});
  if(!pool.length){pick.innerHTML="<div><h3>Nothing fits that window</h3><p>Try a longer slot.</p></div>";pick.classList.add("on");return}
  var i=pool[Math.floor(Math.random()*pool.length)],g=GAMES[i];
  pick.innerHTML=art(g)+"<div><h3>Tonight: "+g.title+"</h3>"+meta(g)+"<p>"+g.desc+"</p><div class=\"sos-actions\">"+links(g)+
   '<button class="sos-btn" type="button" id="sos-again">Pick another</button><button class="sos-btn hot" type="button" id="sos-done">We played it</button></div></div>';
  pick.classList.add("on");
  $("sos-again").onclick=function(){choose(max)};$("sos-done").onclick=function(){pick.classList.remove("on");setPlayed(g.slug,true)};
  var box=shelf.querySelector('.sos-box[data-i="'+i+'"]');if(box){box.classList.remove("glow");void box.offsetWidth;box.classList.add("glow")}
}

buildTitle();loadLocal();render();pull();
if(SYNC){setInterval(pull,20000);document.addEventListener("visibilitychange",function(){if(!document.hidden)pull()})}
})();
</script>
</div>
